<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InHome | Coach Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#FF0000; --navy2:#CC0000; --blue:#FF0000; --blue-dim:#FF000022;
    --paper:#0A0A0A; --line:#2A2A2A; --ink:#F5F5F5; --mute:#888888;
    --good:#1FA35C; --warn:#E0A419; --bad:#CC0000; --card:#141414;
    --accent:#FF0000;
  }
  body.dark-unused{
    --paper:#0A0A0A; --card:#141414; --line:#2A2A2A; --ink:#F5F5F5;
    --mute:#888; background:#0A0A0A; color:#F5F5F5;
  }
  body.dark .bcol{background:#141414; border-color:#2A2A2A;}
  body.dark .bcard{background:#1E1E1E; border-color:#2A2A2A;}
  body.dark .bcard:hover{border-color:#FF0000;}
  body.dark .bcard-name{color:#F5F5F5;}
  body.dark .bcol-head{color:#F5F5F5; border-color:#FF0000;}
  body.dark .m-score{background:#1A1A1A; border-color:#2A2A2A;}
  body.dark .modal{background:#111;}
  body.dark .trait{background:#1A1A1A; border-color:#2A2A2A;}
  body.dark .gate-item{background:#1A1A1A; border-color:#2A2A2A; color:#F5F5F5;}
  body.dark .iq-wrap{background:#1A1A1A; border-color:#2A2A2A;}
  body.dark .iq-track{background:#2A2A2A;}
  body.dark .narrative{background:#1A1A1A; border-color:#2A2A2A;}
  body.dark .iv-wrap{background:#1A1A1A; border-color:#2A2A2A;}
  body.dark .iv-top{border-color:#2A2A2A;}
  body.dark .trk-box{background:#1A1A1A; border-color:#2A2A2A;}
  body.dark .trk-cell{border-color:#2A2A2A;}
  body.dark .mapwrap{background:#141414; border-color:#2A2A2A;}
  body.dark .us-shape{fill:#1A1A1A; stroke:#333;}
  body.dark .board{background:#0A0A0A;}
  body.dark .order-banner{background:#1A0000; border-color:#FF0000;}
  body.dark .vtabs{background:#1A1A1A;}
  body.dark .vtab{color:#888;}
  body.dark .refresh{background:#1A1A1A; border-color:#2A2A2A; color:#888;}
  body.dark .pc-name{color:#F5F5F5;}
  body.dark .m-score-big{color:#FF0000;}
  body.dark .sec-h h3{color:#F5F5F5;}
  body.dark .trait-name{color:#F5F5F5;}
  body.dark .m-side .k{color:#888;}
  body.dark .bar-track{background:#2A2A2A;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{background:#0A0A0A; color:#F5F5F5; font-family:'Barlow',sans-serif;}
  h1,h2,h3,.disp{font-family:'Anton',sans-serif; font-weight:700; letter-spacing:.01em; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  .hidden{display:none !important;}

  /* ---------- GATE ---------- */
  .gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
        background:#0A0A0A; border-top:4px solid #FF0000;}
  .gate-card{width:100%; max-width:420px; text-align:center; color:#F5F5F5;}
  .gate-logo{display:inline-flex; align-items:center; gap:9px; margin-bottom:26px;}
  .gate-logo svg{width:30px; height:30px;}
  .gate-logo .lt{font-family:'Anton',sans-serif; font-weight:700; font-size:24px; letter-spacing:.03em;}
  .gate-logo .lt b{color:var(--blue);}
  .gate-h{font-size:30px; line-height:1.05; color:#FF0000;}
  .gate-tagline{font-family:'Barlow',sans-serif; font-weight:400; font-size:15px; color:#888888; margin-top:14px; letter-spacing:.08em; text-transform:uppercase; line-height:1.1;}
  .gate-sub{color:#888888; font-size:14px; margin-top:10px; letter-spacing:.01em;}
  .gate-form{margin-top:26px; display:flex; flex-direction:column; gap:10px;}
  .gate-form input{width:100%; padding:15px 16px; border-radius:12px; border:1.5px solid #2A2A2A;
        background:#141414; color:#F5F5F5; font-size:16px; text-align:center; letter-spacing:.18em; text-transform:uppercase;}
  .gate-form input:focus{outline:none; border-color:#FF0000; box-shadow:0 0 0 3px #FF000022;}
  .gate-form button{width:100%; padding:15px; border-radius:12px; border:none; background:var(--blue); color:#fff;
        font-family:'Anton',sans-serif; font-weight:700; font-size:16px; letter-spacing:.06em; text-transform:uppercase;}
  .gate-err{color:#FF7D7D; font-size:13px; min-height:18px; margin-top:2px;}
  .gate-demo{margin-top:22px; font-size:13px; color:#888888;}
  .gate-demo a{color:#FF0000; text-decoration:underline; cursor:pointer;}

  /* ---------- PORTAL ---------- */
  #portal{min-height:100vh;}
  .cover{background:#0A0A0A; border-bottom:3px solid #FF0000; color:#F5F5F5; padding:26px 20px 30px;}
  .cover-top{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .cover-logo{display:flex; align-items:center; gap:8px;}
  .cover-logo svg{width:24px; height:24px;}
  .dark-toggle{background:transparent; border:1px solid #2A2A2A; color:#888888;
      font-size:16px; padding:6px 10px; border-radius:8px; line-height:1;}
  
  .cover-exit{background:transparent; border:1px solid #2A2A2A; color:#888888; font-size:12px; padding:7px 12px; border-radius:8px; letter-spacing:.04em;}
  .cover-tag{display:inline-block; margin-top:22px; background:var(--accent); color:#fff; font-family:'Anton',sans-serif;
        font-weight:600; font-size:12px; letter-spacing:.09em; text-transform:uppercase; padding:5px 11px; border-radius:20px;}
  .cover-prog{font-size:38px; line-height:1; margin-top:12px;}
  .cover-note{color:#888888; font-size:14px; margin-top:10px; max-width:560px;}
  .demo-banner{background:#2A1F00; color:#E0A419; font-size:12.5px; font-weight:600; text-align:center; padding:8px 14px; letter-spacing:.02em;}

  .board{max-width:1100px; margin:0 auto; padding:20px 16px 90px;}
  .board-head{display:flex; align-items:baseline; justify-content:space-between; margin:6px 4px 14px; gap:10px; flex-wrap:wrap;}
  .board-head h2{font-size:22px;}
  .board-head .cnt{color:var(--mute); font-size:13px;}
  .head-right{display:flex; align-items:center; gap:12px;}
  .class-select{background:#1A1A1A; border:1px solid #2A2A2A; color:#F5F5F5; border-radius:8px;
      padding:7px 10px; font-family:'Anton',sans-serif; font-size:13px; letter-spacing:.04em;}
  .class-select:focus{outline:none; border-color:#FF0000;}
  .refresh{background:#1A1A1A; border:1px solid #2A2A2A; color:#888888; font-size:12px; font-weight:700;
      padding:6px 13px; border-radius:8px; letter-spacing:.03em;}
  .refresh:hover{border-color:#FF0000; color:#FF0000;}
  .refresh:disabled{opacity:.5;}
  .pos-filter{display:flex; flex-wrap:wrap; gap:7px; margin:0 4px 16px;}
  .pf{background:#1A1A1A; border:1px solid #2A2A2A; border-radius:20px; padding:7px 14px;
      font-family:'Anton',sans-serif; font-weight:700; font-size:13.5px; letter-spacing:.04em;
      color:var(--mute); display:flex; align-items:center; gap:7px;}
  .pf:hover{border-color:#FF0000; color:#FF0000;}
  .pf.on{background:#FF0000; border-color:#FF0000; color:#fff;}
  .pf-n{font-family:'Barlow',sans-serif; font-size:10.5px; font-weight:600; opacity:.65;}
  .empty{grid-column:1/-1; text-align:center; color:#888888; font-size:14px; padding:34px 10px;
      background:#141414; border:1px dashed #2A2A2A; border-radius:12px;}

  .vtabs{display:flex; gap:2px; background:#1A1A1A; padding:2px; border-radius:9px;}
  .vtab{background:transparent; border:none; padding:7px 18px; border-radius:7px;
      font-family:'Anton',sans-serif; font-weight:700; font-size:14px; letter-spacing:.05em;
      color:#666666;}
  .vtab.on{background:#FF0000; color:#fff;}
  .order-banner{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
      background:#1A0000; border:1px solid #FF0000; border-radius:10px;
      padding:9px 14px; margin:0 4px 14px; font-size:12.5px; font-weight:600; color:#FF0000;}
  .order-banner button{background:#fff; border:1px solid #FF0000; color:#FF0000;
      border-radius:7px; padding:5px 11px; font-size:11.5px; font-weight:700;}

  .bcols{display:flex; gap:12px; overflow-x:auto; padding:2px 4px 14px; align-items:flex-start;}
  .bcol{flex:0 0 232px; background:#141414; border:1px solid #2A2A2A; border-radius:12px; padding:10px;}
  .bcol-head{display:flex; justify-content:space-between; align-items:center; padding-bottom:9px;
      border-bottom:2px solid #FF0000; font-family:'Anton',sans-serif; font-weight:700;
      font-size:16px; letter-spacing:.06em; color:var(--navy);}
  .bcol-n{font-family:'Barlow',sans-serif; font-size:11px; font-weight:600; color:var(--mute);}
  .bcol-body{min-height:20px;}
  .bcard{display:flex; align-items:flex-start; gap:9px; background:#1E1E1E; border:1px solid #2A2A2A;
      border-radius:9px; padding:9px 10px; margin-top:8px; cursor:pointer;}
  .bcard:hover{border-color:#FF0000;}
  .bcard:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  .bcard.dragging{opacity:.4;}
  .bcard.over{border-color:#FF0000; border-style:dashed;}
  .bcard-rank{font-family:'Anton',sans-serif; font-weight:700; font-size:13px; color:var(--mute);
      min-width:14px; padding-top:1px;}
  .bcard-body{flex:1; min-width:0;}
  .bcard-name{font-family:'Anton',sans-serif; font-weight:700; font-size:15px; line-height:1.1;
      color:#F5F5F5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bcard-meta{font-size:10.5px; color:var(--mute); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bcard-right{text-align:right;}
  .bcard-score{font-family:'Anton',sans-serif; font-weight:700; font-size:17px; color:#FF0000; line-height:1;}
  .bcard-trk{font-size:8.5px; font-weight:700; color:#FF0000; letter-spacing:.06em; margin-top:3px;}

  .mapwrap{background:#141414; border:1px solid #2A2A2A; border-radius:12px; overflow:hidden;}
  .us-shape{fill:#1A1A1A; stroke:#333333; stroke-width:1.4; stroke-linejoin:round;}






  .map-note{font-size:11.5px; color:#888888; margin-top:10px; font-weight:600;}
  .map-note.warn{color:#8A6100;}
  @media (max-width:560px){ .bcol{flex:0 0 200px;} }
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px;}

  .pc{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease; position:relative;}
  .pc:hover{transform:translateY(-2px); box-shadow:0 10px 26px rgba(6,13,46,.10);}
  .pc:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  .pc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .pc-name{font-family:'Anton',sans-serif; font-weight:700; font-size:21px; line-height:1;}
  .pc-meta{color:var(--mute); font-size:12.5px; margin-top:5px;}
  .pc-pos{background:#FF0000; color:#fff; font-family:'Anton',sans-serif; font-weight:600; font-size:12px;
      letter-spacing:.05em; padding:4px 9px; border-radius:7px; white-space:nowrap;}
  .pc-score-row{display:flex; align-items:center; gap:12px; margin-top:14px;}
  .pc-score{font-family:'Anton',sans-serif; font-weight:700; font-size:34px; line-height:1; color:#FF0000;}
  .pc-score small{font-size:13px; color:var(--mute); font-weight:600; margin-left:2px;}
  .pc-tier{font-size:12px; font-weight:600; color:#FF0000; margin-top:2px;}
  .flag{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; margin-top:11px;}
  .flag.aligned{background:#E7F6EE; color:#0F7A44;}
  .flag.review{background:#FBEFD6; color:#8A6100;}

  /* ---------- MODAL ---------- */
  .overlay{position:fixed; inset:0; background:rgba(6,13,46,.55); backdrop-filter:blur(2px); display:none;
      align-items:flex-start; justify-content:center; padding:20px; z-index:50; overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:#111111; width:100%; max-width:720px; border-radius:16px; overflow:hidden; margin:auto;
      box-shadow:0 24px 70px rgba(0,0,0,.8);}
  .m-head{background:#FF0000; color:#fff; padding:20px 20px 22px; position:relative;}
  .m-close{position:absolute; top:14px; right:14px; background:#CC0000; border:none; color:#cfd6f5; width:32px; height:32px;
      border-radius:9px; font-size:18px; line-height:1;}
  .m-name{font-size:28px; line-height:1;}
  .m-sub{color:#FFE0E0; font-size:13px; margin-top:7px;}
  .m-chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:13px;}
  .chip{background:#CC0000; color:#FFE0E0; font-size:11.5px; padding:4px 9px; border-radius:7px; letter-spacing:.02em;}

  .m-score{display:flex; align-items:center; gap:18px; padding:18px 20px; background:#1A1A1A; border-bottom:1px solid #2A2A2A; flex-wrap:wrap;}
  .m-score-big{font-family:'Anton',sans-serif; font-weight:700; font-size:52px; line-height:.9; color:#FF0000;}
  .m-score-big small{font-size:16px; color:var(--mute); font-weight:600;}
  .m-bars{flex:1; min-width:220px; display:flex; flex-direction:column; gap:7px;}
  .bar-row{display:flex; align-items:center; gap:8px; font-size:12px;}
  .bar-lbl{width:74px; color:var(--mute); font-weight:600;}
  .bar-track{flex:1; height:7px; background:#2A2A2A; border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; background:#FF0000; border-radius:5px;}
  .bar-val{width:30px; text-align:right; font-weight:700; color:var(--ink);}
  .m-side{display:flex; gap:18px;}
  .m-side .k{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#888888; font-weight:600;}
  .m-side .v{font-family:'Anton',sans-serif; font-weight:700; font-size:24px; color:#FF0000; line-height:1; margin-top:3px;}

  .m-body{padding:6px 20px 24px; background:#111111;}
  .sec{margin-top:20px;}
  .sec-h{display:flex; align-items:center; gap:9px; margin-bottom:11px;}
  .sec-num{width:22px; height:22px; border-radius:6px; background:#FF0000; color:#fff; font-family:'Anton',sans-serif;
      font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center;}
  .sec-h h3{font-size:17px; color:#F5F5F5;}
  .sec-h .wt{margin-left:auto; font-size:11px; color:var(--mute); font-weight:600;}

  .trait{background:#1A1A1A; border:1px solid #2A2A2A; border-radius:11px; padding:12px 14px; margin-bottom:9px;}
  .trait-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .trait-name{font-weight:700; font-size:14px; color:#F5F5F5;}
  .trait-grade{font-family:'Anton',sans-serif; font-weight:700; font-size:14px; white-space:nowrap;}
  .trait-grade.g5{color:#0F7A44;} .trait-grade.g4{color:#1FA35C;} .trait-grade.g3{color:#8A6100;}
  .trait-grade.g2{color:#C0631A;} .trait-grade.g1{color:#C4302B;}
  .trait-p{color:#888888; font-size:12.5px; margin-top:5px; line-height:1.45;}
  .trait-metric{font-size:12px; color:var(--ink); margin-top:6px; font-weight:600;}
  .trait-metric span{color:var(--mute); font-weight:500;}

  .gate-item{display:flex; justify-content:space-between; align-items:center; padding:11px 14px; background:#1A1A1A;
      border:1px solid #2A2A2A; border-radius:11px; margin-bottom:8px; font-size:13.5px; font-weight:600; color:#F5F5F5;}
  .pill{font-size:11px; font-weight:700; padding:4px 11px; border-radius:20px; letter-spacing:.04em; text-transform:uppercase;}
  .pill.pass{background:#E7F6EE; color:#0F7A44;} .pill.concern{background:#FBEFD6; color:#8A6100;} .pill.fail{background:#FBE3E3; color:#B32C27;}

  .iq-wrap{background:#1A1A1A; border:1px solid #2A2A2A; border-radius:11px; padding:14px;}
  .iq-top{display:flex; justify-content:space-between; align-items:baseline;}
  .iq-val{font-family:'Anton',sans-serif; font-weight:700; font-size:22px; color:var(--navy);}
  .iq-track{height:8px; background:#2A2A2A; border-radius:5px; margin-top:9px; overflow:hidden;}
  .iq-fill{height:100%; background:#FF0000; border-radius:5px;}

  .narrative{background:#1A1A1A; border:1px solid #2A2A2A; border-left:3px solid #FF0000; border-radius:10px;
      padding:13px 15px; font-size:13.5px; line-height:1.55; color:#CCCCCC;}
  .rec-box{background:#FF0000; color:#fff; border-radius:12px; padding:15px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .rec-box .k{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#9AA6D6; font-weight:600;}
  .rec-box .v{font-family:'Anton',sans-serif; font-weight:700; font-size:22px; margin-top:3px;}
  .m-disc{margin-top:18px; font-size:11px; color:#666666; text-align:center; line-height:1.5;}


  .film-btn{display:inline-block; margin-top:13px; background:#FF0000; color:#fff; text-decoration:none;
      font-family:'Anton',sans-serif; font-weight:700; font-size:13.5px; letter-spacing:.05em;
      text-transform:uppercase; padding:9px 16px; border-radius:9px;}
  .film-btn:hover{filter:brightness(1.12);}
  .film-btn:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  .flag.track{background:#E6EEFF; color:#1A3AFF; margin-left:6px;}
  .trk-box{background:#1A1A1A; border:1px solid #2A2A2A; border-radius:11px; padding:14px;}
  .trk-cells{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:9px;}
  .trk-cell{border:1px solid #2A2A2A; border-radius:9px; padding:10px 8px; text-align:center;}
  .trk-cell.is-key{border-color:#FF0000; background:#FFF0F0;}
  .trk-mark{font-family:'Anton',sans-serif; font-weight:700; font-size:21px; color:#F5F5F5; line-height:1;}
  .trk-cell.is-key .trk-mark{color:#FF0000;}
  .trk-ev{font-size:10.5px; color:var(--mute); font-weight:600; margin-top:3px;}
  .trk-src{font-size:11.5px; color:var(--mute); margin-top:11px; font-weight:600;}
  .iv-wrap{background:#1A1A1A; border:1px solid #2A2A2A; border-radius:11px; padding:14px;}
  .iv-top{display:flex; gap:26px; flex-wrap:wrap; padding-bottom:12px; margin-bottom:4px; border-bottom:1px solid #2A2A2A;}
  .iv-top .k{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#888888; font-weight:600;}
  .iv-top .v{font-family:'Anton',sans-serif; font-weight:700; font-size:17px; color:#FF0000; margin-top:2px;}
  .iv-q{margin-top:13px;}
  .iv-qt{font-size:12.5px; font-weight:700; color:#888888; line-height:1.4;}
  .iv-qa{font-size:13.5px; line-height:1.55; color:#CCCCCC; margin-top:3px;}

  @media (max-width:560px){
    .cover-prog{font-size:30px;} .m-score-big{font-size:42px;} .m-side{flex-direction:column; gap:10px;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
  @media(max-width:680px){.eis-grid{grid-template-columns:1fr !important}}
</style>
</head>
<body>

<!-- ===================== GATE ===================== -->
<div id="gate" class="gate">

   LIVE DATA (optional)
   ============================================================
   Leave LIVE_URL as null and the portal runs entirely off the
   REPORTS block below. Nothing can fail, nothing to deploy.

   To go live, paste the full URL of your list-reports function:
     const LIVE_URL = "https://YOURSITE.netlify.app/.netlify/functions/list-reports";

   If the fetch fails for any reason (offline, function down, hotel
   wifi), the portal silently falls back to the REPORTS block, so a
   demo can never end up showing an empty board.
   ============================================================ */
const CAN_DRAG = !!(window.matchMedia && window.matchMedia('(pointer: fine)').matches);
let lastDragEnd = 0;      // clicks within 250ms of a drop are the drop, not a tap
let activeFilter = 'ALL';   // position filter currently selected
let classFilter  = 'ALL';   // grad class filter, 'ALL' or a year string
const LIVE_URL = "https://inhomepdfreports.netlify.app/.netlify/functions/list-reports";
const LIVE_KEY = null;   // only if you set PORTAL_ACCESS_KEY in Netlify

async function loadLiveReports(){
  if(!LIVE_URL) return false;
  try{
    const url = LIVE_KEY ? LIVE_URL + '?key=' + encodeURIComponent(LIVE_KEY) : LIVE_URL;
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!data.success || !Array.isArray(data.reports)) throw new Error(data.error || 'Bad response');
    if(!data.reports.length) throw new Error('No reports returned');
    /* Merge: keep the embedded board, add live records on top.
       If a live record matches an embedded one on name + position,
       the live (database) version wins. So re-entering a prospect
       through the builder replaces the hardcoded copy, no duplicate. */
    const key = r => ((r.prospect||'').trim().toLowerCase()) + '|' + ((r.position||'').trim().toUpperCase());
    const merged = new Map();
    REPORTS.forEach(r => merged.set(key(r), r));
    data.reports.forEach(r => merged.set(key(r), r));
    REPORTS.length = 0;
    merged.forEach(r => REPORTS.push(r));
    return true;
  } catch(err){
    console.warn('Live data unavailable, using built-in board:', err.message);
    return false;
  }
}

/* ============================================================
   SCORING  (identical math to the report builder)
   ============================================================ */
function avgVals(obj){
  const v = Object.values(obj||{});
  if(!v.length) return null;
  return v.reduce((a,b)=>a+b,0)/v.length;
}
function scoreReport(r){
  const filmAvg = avgVals(r.raw.traitGrades);
  const athAvg  = avgVals(r.raw.athleticGrades);
  const prodAvg = avgVals(r.raw.productionGrades);
  const g = r.raw.gates || {};
  const gateVals = Array.isArray(g) ? g : Object.values(g);
  let charScore = null;
  if(gateVals.length){
    const pts = gateVals.map(x=> x==='pass'?100 : x==='concern'?60 : 0);
    charScore = pts.reduce((a,b)=>a+b,0)/pts.length;
  }
  const filmScore = filmAvg!==null?filmAvg*20:0;
  const athScore  = athAvg!==null?athAvg*20:0;
  const prodScore = prodAvg!==null?prodAvg*20:0;
  const cScore    = charScore!==null?charScore:0;
  const composite = filmScore*0.50 + athScore*0.25 + cScore*0.15 + prodScore*0.10;
  let ti = null;
  if(filmAvg!==null && athAvg!==null && athScore>0) ti = (r.footballIQ * filmScore)/athScore;

  // Live records may arrive with the score already computed server-side and no
  // trait grades attached. Prefer recomputing; fall back to the stored value.
  const noGrades = filmAvg===null && athAvg===null && prodAvg===null;
  if(noGrades && r.inhomeScore!=null && !isNaN(parseFloat(r.inhomeScore))){
    const stored = parseFloat(r.inhomeScore);
    const storedTi = parseFloat(r.translationIndex);
    return {composite:stored, filmScore:0, athScore:0, cScore:0, prodScore:0,
            ti: isNaN(storedTi)?null:storedTi, estimated:true};
  }
  return {composite, filmScore, athScore, cScore, prodScore, ti, estimated:false};
}
function gradeWord(n){ return n ? (n + " · " + GRADE_LABELS[n-1]) : "Not graded"; }
function hasTrack(r){
  const ev = (r.raw && r.raw.track && r.raw.track.events) || {};
  return Object.keys(ev).length > 0;
}
function esc(s){ return (s==null?"":String(s)).replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* Scouts type weight as either "205" or "205 lbs". Render one unit, never two. */
function fmtWeight(w){
  const v = (w==null?"":String(w)).trim();
  if(!v) return "";
  return /lb/i.test(v) ? v : v + " lbs";
}
/* Film link: only render http(s) links, and open in a new tab. */
function filmLinkHTML(url){
  const u = (url==null?"":String(url)).trim();
  if(!/^https?:\/\//i.test(u)) return "";
  return `<a class="film-btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Watch film</a>`;
}

async function openPortal(prog){
  document.documentElement.style.setProperty('--accent', prog.p || prog.accent || '#FF0000');
  document.getElementById('coverTag').textContent  = prog.tag;
  const _mk = prog.i
    ? `<img src="https://a.espncdn.com/i/teamlogos/ncaa/500/${prog.i}.png" alt=""
        style="width:34px;height:34px;object-fit:contain;background:#fff;border-radius:7px;padding:2px;vertical-align:-9px;margin-right:10px"
        onerror="this.outerHTML='<span style=\\'display:inline-block;width:8px;height:30px;border-radius:3px;background:linear-gradient(180deg,${prog.p||'#555'},${prog.x||'#222'});vertical-align:-7px;margin-right:10px\\'></span>'">`
    : '';
  document.getElementById('coverProg').innerHTML = _mk + esc(prog.name);
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('portal').classList.remove('hidden');
  programKey = prog.name.replace(/[^A-Za-z0-9]/g,'') || 'DEFAULT';
  loadOrder();
  document.getElementById('boardCnt').textContent = LIVE_URL ? 'Loading...' : '';
  renderCurrentView();
  window.scrollTo(0,0);

  if(LIVE_URL){
    const live = await loadLiveReports();
    if(live) renderCurrentView();
    const rb = document.getElementById('refreshBtn');
    if(rb) rb.classList.remove('hidden');
  }
}
function signOut(){
  document.getElementById('portal').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('codeInput').value = "";
  closeModal();
}

  [43.1,-70.8],[44.8,-67.0],[47.4,-69.2],[45.0,-71.5],[44.0,-76.0],
  [43.3,-79.0],[41.7,-82.5],[46.0,-83.0],[46.5,-87.0],[46.7,-90.0],
  [46.7,-92.0],[49.0,-95.0],[49.0,-104.0],[49.0,-117.0],[49.0,-123.0]
];

const MAP_W = 760, MAP_H = 470;
const LAT_MAX = 49.5, LAT_MIN = 24.5, LNG_MIN = -125.5, LNG_MAX = -66.5;

function project(lat, lng){
  return {
    x: ((lng - LNG_MIN) / (LNG_MAX - LNG_MIN)) * MAP_W,
    y: ((LAT_MAX - lat) / (LAT_MAX - LAT_MIN)) * MAP_H
  };
}

/* Pull a two-letter state out of "Central-Phenix City (AL)" or "Hoover, AL". */
function stateOf(report){
  const s = report.school || '';
  let m = s.match(/\(([A-Za-z]{2})\)\s*$/);
  if(!m) m = s.match(/,\s*([A-Za-z]{2})\s*$/);
  if(m){
    const code = m[1].toUpperCase();
    if(STATE_COORDS[code]) return code;
  }
  return null;
}

/* Exact coordinates if we have them, otherwise the state centroid. */
function coordsOf(report){
  const lat = report.lat != null ? report.lat : (report.raw && report.raw.lat);
  const lng = report.lng != null ? report.lng : (report.raw && report.raw.lng);
  if(lat != null && lng != null && !isNaN(lat) && !isNaN(lng)){
    return {lat:Number(lat), lng:Number(lng), exact:true, state:stateOf(report)};
  }
  const st = stateOf(report);
  if(!st) return null;
  return {lat:STATE_COORDS[st][0], lng:STATE_COORDS[st][1], exact:false, state:st};
}

/* ------------------------------------------------------------

   A coach can drag prospects to rank them however they want. This
   never changes the InHome Score. It is that coach's board only,
   saved in their browser under their program key.
   ------------------------------------------------------------ */
function orderStorageKey(){ return 'inhome_board_order_' + programKey; }

function loadOrder(){
  try{
    const raw = window.localStorage.getItem(orderStorageKey());
    boardOrder = raw ? JSON.parse(raw) : null;
  } catch(err){ boardOrder = null; }
}
function saveOrder(){
  try{
    if(boardOrder) window.localStorage.setItem(orderStorageKey(), JSON.stringify(boardOrder));
    else window.localStorage.removeItem(orderStorageKey());
  } catch(err){ /* private browsing, ignore */ }
}

  boardOrder = null; saveOrder(); renderCurrentView();

/* Stable identity for a report across refreshes. */
function keyOf(r){ return r.id != null ? String(r.id) : (r.prospect + '|' + r.position); }

function matchesClass(r){
  return classFilter === 'ALL' || String(r.classYear || '') === classFilter;
}

/* Grad class dropdown, built from whatever classes are actually on the board.
   Hidden entirely when there is only one class. */
function renderClassFilter(){
  const host = document.getElementById('classSelectWrap');
  if(!host) return;
  const counts = {};
  REPORTS.forEach(r=>{
    const c = String(r.classYear || '').trim();
    if(c) counts[c] = (counts[c]||0)+1;
  });
  const classes = Object.keys(counts).sort();
  if(classFilter !== 'ALL' && !counts[classFilter]) classFilter = 'ALL';
  if(classes.length < 2){ host.innerHTML=''; classFilter='ALL'; return; }
  host.innerHTML = `<select id="classSelect" class="class-select" aria-label="Filter by grad class">
    <option value="ALL">All classes</option>
    ${classes.map(c=>`<option value="${esc(c)}"${classFilter===c?' selected':''}>Class of ${esc(c)} (${counts[c]})</option>`).join('')}

    classFilter = e.target.value;

/* Reports for one position, in the coach's order if they set one,
   otherwise ranked by InHome Score descending. */
function groupFor(pos){
  const list = REPORTS.map((r,i)=>({r,i})).filter(x=>x.r.position===pos && matchesClass(x.r));
  const custom = boardOrder && boardOrder[pos];
  if(custom){
    const rank = {};
    custom.forEach((k,idx)=>{ rank[k] = idx; });
    list.sort((a,b)=>{
      const ra = rank[keyOf(a.r)], rb = rank[keyOf(b.r)];
      if(ra == null && rb == null) return scoreReport(b.r).composite - scoreReport(a.r).composite;
      if(ra == null) return 1;
      if(rb == null) return -1;
      return ra - rb;
    });
  } else {
    list.sort((a,b)=>scoreReport(b.r).composite - scoreReport(a.r).composite);
  }
  return list;
}

function positionsPresent(){
  const seen = {};
  REPORTS.forEach(r=>{ if(matchesClass(r)) seen[r.position] = true; });
  return Object.keys(POSITIONS).filter(p=>seen[p]);
}

let _cardsDelegated = false;
function wireCards(host){
  if(_cardsDelegated) return;
  _cardsDelegated = true;
  const root = document.getElementById('viewHost');
  root.addEventListener('click', e=>{
    const el = e.target.closest('.bcard');
    if(!el) return;
    if(Date.now() - lastDragEnd < 250) return;   // that click was the tail of a drop
    openReport(+el.dataset.i);
  });
  root.addEventListener('keydown', e=>{
    const el = e.target.closest('.bcard');
    if(!el) return;
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openReport(+el.dataset.i); }
  });
}

function wireDrag(host){
  if(!CAN_DRAG) return;
  let dragged = null;
  host.querySelectorAll('.bcard').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      dragged = el; el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', el.dataset.key); }catch(err){}
    });
    el.addEventListener('dragend', ()=>{
      el.classList.remove('dragging');
      lastDragEnd = Date.now();
      dragged = null;
      host.querySelectorAll('.bcard').forEach(c=>c.classList.remove('over'));
    });
    el.addEventListener('dragover', e=>{
      if(!dragged || dragged === el) return;
      if(dragged.dataset.pos !== el.dataset.pos) return;  // stay within position group
      e.preventDefault();
      el.classList.add('over');
    });
    el.addEventListener('dragleave', ()=>el.classList.remove('over'));
    el.addEventListener('drop', e=>{
      e.preventDefault();
      el.classList.remove('over');
      if(!dragged || dragged === el) return;
      if(dragged.dataset.pos !== el.dataset.pos) return;
      const body = el.parentNode;
      const cards = Array.from(body.children);
      const from = cards.indexOf(dragged), to = cards.indexOf(el);
      if(from < to) body.insertBefore(dragged, el.nextSibling);
      else body.insertBefore(dragged, el);
      commitOrder(body);
    });
  });
}

function commitOrder(body){
  const pos = body.dataset.pos;
  const keys = Array.from(body.children).map(c=>c.dataset.key);
  boardOrder = boardOrder || {};
  boardOrder[pos] = keys;
  saveOrder();
  renderBoardView();          // renumber the rank badges
  updateOrderBanner();
}

function updateOrderBanner(){
  const b = document.getElementById('orderBanner');
  if(!b) return;
  b.classList.toggle('hidden', !boardOrder);
}

function renderCurrentView(){
  renderClassFilter();
  const shown = REPORTS.filter(matchesClass).length;
  document.getElementById('boardCnt').textContent =
    classFilter==='ALL' ? REPORTS.length + ' evaluated'
                        : shown + ' in class of ' + classFilter;
  document.querySelectorAll('.vtab').forEach(t=>t.classList.toggle('on', t.dataset.view===currentView));
  if(currentView==='map') renderMapView(); else renderBoardView();
  updateOrderBanner();
}

    + '<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#1FA35C;margin-right:5px"></i>Win</span>'
    + '<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#7A7A7A;margin-right:5px"></i>Not graded</span>'
    + '<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#CC0000;margin-right:5px"></i>Loss</span></div>'
    + rows
    + '<div style="font-size:11px;color:var(--mute);margin-top:9px;line-height:1.5">Computed from graded film reps, not entered by hand. Percentages count wins against losses; ungraded reps are shown but excluded.</div></div>';
}

function recsHTML(r){
  var recs=(r.raw&&r.raw.recommendedPrograms)||[]; if(!recs.length) return "";
  var me=(typeof programKey!=="undefined")?programKey:"";
  var rows=recs.map(function(x){
    var mine=me&&x.program&&x.program.replace(/[^A-Za-z0-9]/g,"")===me;
    var mk=x.espnId?'<img src="https://a.espncdn.com/i/teamlogos/ncaa/500/'+x.espnId+'.png" alt="" style="width:30px;height:30px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;flex:0 0 auto" onerror="this.style.display=\'none\'">':"";
    return '<div style="display:flex;gap:10px;align-items:flex-start;border:1px solid '+(mine?'var(--accent)':'var(--line)')+';border-radius:10px;padding:11px;background:'+(mine?'rgba(255,0,0,.06)':'var(--card)')+';margin-top:8px">'
      + mk + '<div><div style="font-family:\'Anton\',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:.02em">'+esc(x.program)
      + (mine?'<span style="font-size:9px;background:var(--accent);color:#fff;border-radius:9px;padding:2px 7px;margin-left:7px;vertical-align:1px;letter-spacing:.08em">YOUR PROGRAM</span>':'')+'</div>'
      + '<div style="font-size:10.5px;color:var(--mute)">'+esc(x.conference||"")+(x.state?(" &middot; "+esc(x.state)):"")+'</div>'
      + (x.fit?'<div style="font-size:12px;color:#CFCFCF;line-height:1.5;margin-top:4px">'+esc(x.fit)+'</div>':"")
      + '</div></div>'; }).join("");
  return '<div class="sec"><div class="sec-h"><span class="sec-num">&#9733;</span><h3>Scout Recommended Fits</h3></div>'+rows+'</div>';
}

function evidenceHTML(r){
  var all=(r.raw&&r.raw.eisReps)||[]; if(!all.length) return "";
  var reps = EIS_FILTER==="win" ? all.filter(function(x){return x.grade>0;})
           : EIS_FILTER==="loss" ? all.filter(function(x){return x.grade<0;}) : all;
  var i=(typeof r.__idx!=="undefined")?r.__idx:0;
  function fb(k,l){ return '<button onclick="setEisFilter(\''+k+'\','+i+')" style="background:'+(EIS_FILTER===k?'rgba(255,0,0,.08)':'var(--card)')+';border:1px solid '+(EIS_FILTER===k?'var(--accent)':'var(--line)')+';color:'+(EIS_FILTER===k?'var(--ink)':'var(--mute)')+';border-radius:15px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer">'+l+'</button>'; }
  var filters='<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px">'
    + fb('all','All reps ('+all.length+')')
    + fb('win','Wins ('+all.filter(function(x){return x.grade>0;}).length+')')
    + fb('loss','Losses ('+all.filter(function(x){return x.grade<0;}).length+')')+'</div>';
  var empty=reps.length?"":'<div style="font-size:12.5px;color:var(--mute);padding:12px 0">No reps match that filter.</div>';
  var rows=reps.map(function(x,idx){
    var g=EIS_GL[x.grade]||EIS_GL[0]; var src=FILM_SOURCES[x.film_id];
    var canPlay=src&&(src.type==="mp4"||src.type==="youtube");
    var slotId="eis_"+idx+"_"+(x.id||idx);
    var frame = x.id
      ? '<img src="'+FRAME_URL+encodeURIComponent(x.id)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.outerHTML=\'<div style=&quot;display:grid;place-items:center;height:100%;color:#666;font-size:11px&quot;>No still frame</div>\'">'
      : '<div style="display:grid;place-items:center;height:100%;color:#666;font-size:11px">No still frame</div>';
    var play = canPlay
      ? '<button onclick="eisPlay(\''+slotId+'\',\''+esc(x.film_id)+'\','+(x.clip_in==null?'null':x.clip_in)+','+(x.clip_out==null?'null':x.clip_out)+')" style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);border:0;cursor:pointer"><span style="width:42px;height:42px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:15px;padding-left:3px">&#9654;</span></button>'
      : "";
    var hudl = (src&&src.type==="hudl")
      ? '<a href="'+src.url+'" target="_blank" rel="noopener" style="display:block;margin-top:6px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:11px;color:var(--ink);text-decoration:none">Open in Hudl at '+eisTC(x.clip_in)+'</a>'
      : "";
    var tags=(x.traits||[]).map(function(t){return '<span style="font-size:10px;padding:3px 8px;border-radius:11px;border:1px solid var(--line);color:var(--mute)">'+esc(t)+'</span>';}).join("");
    return '<div style="border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:9px;background:var(--card)">'
      + '<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(0,0,0,.35);border-bottom:1px solid var(--line);flex-wrap:wrap">'
      + '<span style="font-size:12px;color:var(--mute)">'+(x.jersey?("#"+esc(x.jersey)+" &bull; "):"")+'<b style="color:var(--ink)">'+esc(x.coverage||"")+'</b>'+(x.observed_action?(" &bull; "+esc(x.observed_action)):"")+'</span>'
      + '<span style="margin-left:auto;font-family:\'Anton\',sans-serif;font-size:10.5px;letter-spacing:.08em;padding:4px 10px;border-radius:11px;text-transform:uppercase;background:'+g[1]+';color:#0A0A0A">'+g[0]+'</span></div>'
      + '<div style="display:grid;grid-template-columns:210px 1fr;gap:13px;padding:12px" class="eis-grid">'
      + '<div><div id="'+slotId+'" style="position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000">'+frame+play+'</div>'
      + (x.film_id?'<div style="font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:#666;margin-top:5px;word-break:break-all">'+esc(x.film_id)+(x.clip_in!=null?("<br>"+eisTC(x.clip_in)+" to "+eisTC(x.clip_out)):"")+'</div>':"")
      + hudl + '</div>'
      + '<div>' + (tags?'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">'+tags+'</div>':"")
      + '<div style="font-size:13px;line-height:1.6;color:#DCDCDC">'+esc(x.evaluation||"")+'</div>'
      + (x.scout?'<div style="font-size:11px;color:#666;margin-top:8px">Graded by <b style="color:var(--mute)">'+esc(x.scout)+'</b></div>':"")
      + '</div></div></div>'; }).join("");
  var w=all.filter(function(x){return x.grade>0;}).length, l=all.filter(function(x){return x.grade<0;}).length;
  return '<div class="sec"><div class="sec-h"><span class="sec-num">&#9658;</span><h3>EIS Film Evidence</h3><span class="wt">'+all.length+' reps &middot; '+w+'W '+l+'L</span></div>'+filters+empty+rows+'</div>';
}

function eisPlay(slotId, filmId, inS, outS){
  var src=FILM_SOURCES[filmId], slot=document.getElementById(slotId);
  if(!src||!slot) return;
  inS = (inS==null)?0:inS;
  if(src.type==="youtube"){
    var q="start="+Math.floor(inS)+(outS!=null?("&end="+Math.ceil(outS)):"")+"&autoplay=1&rel=0";
    slot.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+src.id+'?'+q+'" allow="autoplay; encrypted-media" allowfullscreen style="width:100%;height:100%;border:0"></iframe>';
    return;
  }
  if(src.type==="mp4"){
    slot.innerHTML='<video controls playsinline preload="metadata" style="width:100%;height:100%;display:block;background:#000" src="'+src.url+'#t='+inS+(outS!=null?(","+outS):"")+'"></video>';
    var v=slot.querySelector("video");
    v.addEventListener("loadedmetadata",function(){ v.currentTime=inS; v.play().catch(function(){}); });
    if(outS!=null) v.addEventListener("timeupdate",function(){ if(v.currentTime>=outS) v.pause(); });
  }
}

function openReport(i){
  try { return _openReportInner(i); }
  catch(err){
    console.error('openReport failed:', err);
    const ov = document.getElementById('overlay');
    const mod = document.getElementById('modal');
    if(ov && mod){
      mod.innerHTML = '<div style="padding:30px;font-family:sans-serif">'
        + '<div style="font-size:16px;font-weight:700;color:#FF0000;margin-bottom:8px">This report could not be displayed</div>'
        + '<div style="font-size:13px;color:#888;margin-bottom:14px">Screenshot this and send it to Claude:</div>'
        + '<div style="font-size:12px;background:#1A1A1A;border:1px solid #2A2A2A;border-radius:8px;padding:12px;color:#F5F5F5;word-break:break-word">'
        + String(err && err.message || err).replace(/</g,'&lt;')
        + '</div>'
        + '<button onclick="closeModal()" style="margin-top:16px;background:#FF0000;color:#fff;border:none;border-radius:7px;padding:9px 18px;font-weight:700;cursor:pointer">Close</button>'
        + '</div>';
      ov.classList.remove('hidden');
    }
  }
}
function _openReportInner(i){
  const r = REPORTS[i];
  r.__idx = i;
  if(window.__lastReport !== i){ EIS_FILTER = "all"; window.__lastReport = i; }
  const cfg = POSITIONS[r.position];
  if(!cfg){
    document.getElementById('modal').innerHTML =
      `<div class="m-head"><button class="m-close" onclick="closeModal()" aria-label="Close">&times;</button>
       <div class="m-name">${esc(r.prospect)}</div>
       <div class="m-sub">Position "${esc(r.position)}" is not in the report template.</div></div>
       <div class="m-body"><div class="sec"><div class="narrative">This report was filed under a position code the portal does not recognize. Check the position field on the scouting report.</div></div></div>`;
    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow='hidden';
    return;
  }
  const s = scoreReport(r);

  const filmRows = cfg.film.map(t=>{
    const g = r.raw.traitGrades[t.id];
    return `<div class="trait"><div class="trait-top"><span class="trait-name">${esc(t.name)}</span>
      <span class="trait-grade g${g||0}">${gradeWord(g)}</span></div>
      <div class="trait-p">${esc(t.p)}</div></div>`;
  }).join('');

  const athRows = cfg.athletic.map(t=>{
    const g = r.raw.athleticGrades[t.id];
    const raw = r.raw.athleticRaw && r.raw.athleticRaw[t.id];
    return `<div class="trait"><div class="trait-top"><span class="trait-name">${esc(t.name)}</span>
      <span class="trait-grade g${g||0}">${gradeWord(g)}</span></div>
      <div class="trait-metric">${esc(raw||"n/a")} <span>· ${esc(t.metric)}</span></div></div>`;
  }).join('');

  const prodRows = cfg.production.map(t=>{
    const g = r.raw.productionGrades[t.id];
    const raw = r.raw.productionRaw && r.raw.productionRaw[t.id];
    return `<div class="trait"><div class="trait-top"><span class="trait-name">${esc(t.name)}</span>
      <span class="trait-grade g${g||0}">${gradeWord(g)}</span></div>
      <div class="trait-metric">${esc(raw||"n/a")} <span>· ${esc(t.metric)}</span></div></div>`;
  }).join('');

  const gateRows = cfg.gates.map((g,idx)=>{
    const store = r.raw.gates || {};
    const key = g.replace(/[^a-zA-Z0-9]/g,'');
    const v = (Array.isArray(store) ? store[idx] : store[key]) || "fail";
    const label = v==='pass'?'Pass':v==='concern'?'Concern':'Flag';
    return `<div class="gate-item"><span>${esc(g)}</span><span class="pill ${v}">${label}</span></div>`;
  }).join('');

  const iqPct = Math.round((r.footballIQ/10)*100);

  document.getElementById('modal').innerHTML = `
    <div class="m-head">
      <button class="m-close" onclick="closeModal()" aria-label="Close">&times;</button>
      <div class="m-name">${esc(r.prospect)}</div>
      <div class="m-sub">${esc(cfg.label)} · ${esc(r.archetype)} · Class of ${esc(r.classYear)}</div>
      <div class="m-chips">
        <span class="chip">${esc(r.school)}</span>
        <span class="chip">${esc(r.height)} · ${esc(fmtWeight(r.weight))}</span>
        <span class="chip">Scout: ${esc(r.scoutName)}</span>
        <span class="chip">${esc(r.dateEvaluated)}</span>
        ${r.evalCamp?`<span class="chip">Evaluated at ${esc(r.evalCamp)}</span>`:''}
      </div>
      ${filmLinkHTML(r.filmLink)}
    </div>

    <div class="m-score">
      <div class="m-score-big">${s.composite.toFixed(1)}<small>/100</small></div>
      <div class="m-bars">
        ${barRow('Film', s.filmScore, '50%')}
        ${barRow('Athletic', s.athScore, '25%')}
        ${barRow('Character', s.cScore, '15%')}
        ${barRow('Production', s.prodScore, '10%')}
      </div>
      <div class="m-side">
        <div><div class="k">Translation Idx</div><div class="v">${s.ti!==null?s.ti.toFixed(2):"n/a"}</div></div>
        <div><div class="k">Football IQ</div><div class="v">${r.footballIQ}<small style="font-size:13px;color:#9AA6D6">/10</small></div></div>
      </div>
    </div>

    <div class="m-body">
      ${splitsHTML(r)}
      <div class="sec"><div class="sec-h"><span class="sec-num">1</span><h3>Film Evaluation</h3><span class="wt">50% weight</span></div>${filmRows}</div>
      <div class="sec"><div class="sec-h"><span class="sec-num">2</span><h3>Athletic Testing</h3><span class="wt">25% weight</span></div>${athRows}</div>
      <div class="sec"><div class="sec-h"><span class="sec-num">3</span><h3>Production</h3><span class="wt">10% weight</span></div>${prodRows}</div>
      <div class="sec"><div class="sec-h"><span class="sec-num">4</span><h3>The Gates</h3><span class="wt">Character · gate</span></div>${gateRows}</div>
      <div class="sec"><div class="sec-h"><span class="sec-num">5</span><h3>Football IQ</h3><span class="wt">standalone gauge</span></div>
        <div class="iq-wrap"><div class="iq-top"><span style="font-weight:600;font-size:13px;color:var(--mute)">Standalone, not in composite</span><span class="iq-val">${r.footballIQ}/10</span></div>
        <div class="iq-track"><div class="iq-fill" style="width:${iqPct}%"></div></div></div></div>
      <div class="sec"><div class="sec-h"><span class="sec-num">6</span><h3>Scout Narrative</h3></div>
        <div class="narrative">${esc(r.narrative)}</div></div>
      ${trackHTML(r)}
      ${interviewHTML(r)}
      <div class="sec"><div class="rec-box"><div><div class="k">Recommendation</div><div class="v">${esc(r.recommendationTier)}</div></div>
        ${r.modelScout?`<div style="text-align:right"><div class="k">Model vs Scout</div><div class="v" style="font-size:16px">${r.modelScout==='review'?'Review':'Aligned'}</div></div>`:''}</div></div>
      ${recsHTML(r)}
      ${evidenceHTML(r)}
      <div class="m-disc">InHome Recruiting Intelligence · EIS All-22 evaluation · Program names listed for evaluation and fit purposes only; not affiliated with or endorsed by any institution listed.</div>
    </div>`;

  const ov = document.getElementById('overlay');
  ov.classList.add('open');
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{ document.querySelectorAll('.bar-fill').forEach(b=>{ b.style.width=b.dataset.w; }); });
}
/* Verified track marks. Reference data, deliberately not in the composite. */
function trackHTML(r){
  const t = (r.raw && r.raw.track) || {};
  const ev = t.events || {};
  const present = TRACK_EVENTS.filter(e=>ev[e.id]);
  if(!present.length) return '';
  const cells = present.map(e=>`<div class="trk-cell${e.key.includes(r.position)?' is-key':''}">
      <div class="trk-mark">${esc(ev[e.id])}</div>
      <div class="trk-ev">${esc(e.name)}</div></div>`).join('');
  const meta = [t.source, t.season].filter(Boolean).map(esc).join(' · ');
  return `<div class="sec"><div class="sec-h"><span class="sec-num">7</span><h3>Verified Track</h3>
    <span class="wt">reference · not scored</span></div>
    <div class="trk-box"><div class="trk-cells">${cells}</div>
    ${meta?`<div class="trk-src">Verified via ${meta}</div>`:''}</div></div>`;
}

/* Player Interview - learning style, impression, and any answers on file. */
function interviewHTML(r){
  const iv = (r.raw && r.raw.interview) || {};
  const answers = iv.answers || {};
  const answered = INTERVIEW_QS.filter(q=>answers[q.id]);
  if(!iv.learnStyle && !iv.impression && !answered.length) return '';

  let top = '';
  if(iv.learnStyle || iv.impression){
    top = `<div class="iv-top">
      ${iv.learnStyle?`<div><div class="k">Learns best by</div><div class="v">${esc(iv.learnStyle)}</div></div>`:''}
      ${iv.impression?`<div><div class="k">Interview impression</div><div class="v">${iv.impression} · ${esc(IMPRESSION_LABELS[iv.impression-1]||'')}</div></div>`:''}
    </div>`;
  }
  const qs = answered.map(q=>`<div class="iv-q"><div class="iv-qt">${esc(q.q)}</div>
      <div class="iv-qa">${esc(answers[q.id])}</div></div>`).join('');

  return `<div class="sec"><div class="sec-h"><span class="sec-num">8</span><h3>Player Interview</h3>
    <span class="wt">character · makeup</span></div>
    <div class="iv-wrap">${top}${qs}</div></div>`;
}

function barRow(lbl, val, wt){
  return `<div class="bar-row"><span class="bar-lbl">${lbl} <span style="color:#b3b9cc">${wt}</span></span>
    <span class="bar-track"><span class="bar-fill" data-w="${Math.min(val,100)}%" style="width:0"></span></span>
    <span class="bar-val">${Math.round(val)}</span></div>`;
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
}
